title: Trænger du til ro i krop og sind
description: >-
  Trænger du til ro i krop og sind?

  Kom og oplev Yoga Nidra, også kaldet "yogisk søvn", hos @atmayogahouse i Ommel.

  Med Anna Kramer som guide bliver du gennem meditation og åndedrætsøvelser ført ind i en dybt
  afslappende tilstand mellem vågenhed og søvn. En teknik, der kan hjælpe med at reducere stress og
  skabe bedre søvn.

  16. september kl. 17.00-18.00

  Atma Yoga House, Kærvej 17, Ommel

  Gratis deltagelse, tilmeld dig på sms til Anna 55 22 32 36.

  BEMÆRK, der er venteliste til dette arrangement!

  Arrangeret af Ommel Sundhedslandsby. En del af Sundhedsfestivalen TÆND FOR SØVNEN. Se hele ugens
  program på www.aeroekommune.dk/sundhedsfestival
