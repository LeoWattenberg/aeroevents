title: Har du lyst til at deltage med en bod til årets julemarked i Ærøskøbings smukke rammer
description: >-
  Har du lyst til at deltage med en bod til årets julemarked i Ærøskøbings smukke rammer?

  Læs mere nedenfor

  Vi ønsker at præsentere alt det bedste fra vores smukke ø samt fra andre kreative udstillere, som
  ønsker at komme til Ærø. Vi stræber efter indretning og præsentation, som er tilpasset de smukke
  rammer i Ærøskøbing.

  HVORNÅR

  Julemarkederne afholdes i år over fire lørdage.

  Henholdsvis lørdag d. 21/11, lørdag d. 28/11, lørdag d. 5/12 samt lørdag d. 12/12.

  Vi holder åbent fra kl. 9.30-17 alle dage.

  BODER

  Man kan vælge at leje en bod for en, to, tre eller alle lørdage.

  Vi stræber efter indretning og præsentation, som er tilpasset de smukke rammer i Ærøskøbing.
  Derfor er der nogle retningslinjer til interiør omkring boderne, etc. som vil blive udspecificeret
  ved tilmelding.

  Pris for leje af boder er:

  Store boder på torvet med adgang til strøm: 600 kr. pr. lørdag

  (disse boder er forbeholdt mad og drikke)

  Små boder på torvet med adgang til strøm 450 kr pr lørdag

  Små boder i Søndergade 350 kr. pr. lørdag

  De store boder på torvet er som skrevet ovenfor forbeholdt mad, men skulle der være plads til
  andre, vil vi tage en vurdering af, hvilke produkter der egner sig bedste til torvet og trække lod
  mellem disse.

  Når vi har modtaget din ansøgning, vil din tilmelding først være gældende og bindende når leje
  indtægten er indbetalt. Ved senere aflysning refunderes pengene ikke.

  Boderne tildeles efter først-til-mølle princippet. Såfremt der er flere tilmeldte, end der er
  boder, oprettes en venteliste.

  Inden første julemarked laves en oversigt over, hvem der har hvilke boder de enkelte weekender.

  TILMELDING:

  I kan tilmelde jer på følgende måde:

  1. Skriv en kommentar om at I ønsker at modtage tilmeldingsblanketten

  2. Send en e-mail med den udfyldte tilmeldingsblanket til info@cafe-aroma.dk

  Vi glæder os til at høre fra jer og ikke mindst til endnu et smukt julemarked i Ærøskøbings
  hyggelige kulisse

  De bedste hilsner

  Ærøskøbings Erhvervsforening
