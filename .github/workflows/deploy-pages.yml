name: Deploy calendar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # A daily rebuild advances the rolling 12-month occurrence window even
    # when no event source changed. GitHub cron schedules use UTC.
    - cron: "23 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set deployment URL and base path
        env:
          CONFIGURED_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CONFIGURED_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          CONFIGURED_SUBMISSION_EMAIL: ${{ vars.PUBLIC_SUBMISSION_EMAIL }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY##*/}"
          if [[ -n "${CONFIGURED_SITE_URL}" ]]; then
            echo "PUBLIC_SITE_URL=${CONFIGURED_SITE_URL}" >> "${GITHUB_ENV}"
          else
            echo "PUBLIC_SITE_URL=https://${owner}.github.io" >> "${GITHUB_ENV}"
          fi
          if [[ -n "${CONFIGURED_BASE_PATH}" ]]; then
            echo "PUBLIC_BASE_PATH=${CONFIGURED_BASE_PATH}" >> "${GITHUB_ENV}"
          elif [[ "${repository,,}" == "${owner,,}.github.io" ]]; then
            echo "PUBLIC_BASE_PATH=/" >> "${GITHUB_ENV}"
          else
            echo "PUBLIC_BASE_PATH=/${repository}" >> "${GITHUB_ENV}"
          fi
          if [[ -z "${CONFIGURED_SUBMISSION_EMAIL}" ]]; then
            echo "::error::Set repository variable PUBLIC_SUBMISSION_EMAIL before deploying."
            exit 1
          fi
          echo "PUBLIC_SUBMISSION_EMAIL=${CONFIGURED_SUBMISSION_EMAIL}" >> "${GITHUB_ENV}"

      - name: Validate data and application code
        run: npm run check

      - name: Run unit and integration tests
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
